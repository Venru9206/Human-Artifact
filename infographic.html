<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthwave Infographic</title>
  <!-- Links to your existing synthwave styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar with a functional Back/Home navigation button -->
  <header class="top-bar">
    <a href="index.html" class="back-link">← RETURN TO TERMINAL</a>
    <div class="class-name">Web Development</div>
  </header>

  <!-- Full Page Infographic Wrapper -->
  <main class="infographic-page">
    <div class="infographic-container">
      
      <!-- Option A: If your infographic is a pre-made image file -->
      <img src="your-infographic-file.png" alt="Synthwave Data Infographic" class="infographic-media">
      
      <!-- Option B: Delete the <img> tag above if you are building the 
           infographic out of HTML divs, text blocks, and charts here! -->

    </div>
  </main>

</body>
</html>
